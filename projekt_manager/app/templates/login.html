{% extends "base.html" %}
{% block title %}Prihlásenie – {{ app_name }}{% endblock %}
{% block main_class %}login-wrap{% endblock %}
{% block content %}
<div class="card login-card">
  <h1 class="brand" style="gap:12px"><svg class="brand-logo" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0f8a5f"/><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="6.5" width="13" height="12" rx="1.6"/><path d="M5.5 10h13M9 5v3M15 5v3M8.5 13.5h3M8.5 16h5"/></g></svg>{{ app_name }}</h1>
  <p class="muted">Prihláste sa svojím e-mailom.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">E-mail</label><input type="email" id="email" name="email" required autofocus></div>
    <div class="field"><label for="password">Heslo</label><input type="password" id="password" name="password" required></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center">Prihlásiť</button>
  </form>
</div>
{% endblock %}
