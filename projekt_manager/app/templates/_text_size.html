{% macro text_size_switch() %}
<form method="post" action="{{ url_for('main.set_font_scale') }}" class="text-size" role="group" aria-label="Veľkosť textu">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% for val, lbl in font_scales.items() %}
    <button name="scale" value="{{ val }}" class="ts-{{ loop.index }} {{ 'active' if font_scale == val }}"
            title="Veľkosť textu: {{ lbl }}" aria-label="Veľkosť textu: {{ lbl }}"
            aria-pressed="{{ 'true' if font_scale == val else 'false' }}">A</button>
  {% endfor %}
</form>
{% endmacro %}
