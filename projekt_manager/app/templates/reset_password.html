{% extends "base.html" %}
{% block title %}Nové heslo – {{ app_name }}{% endblock %}
{% block main_class %}login-wrap{% endblock %}
{% block content %}
<div class="card login-card">
  <h1 class="brand" style="gap:12px"><svg class="brand-logo" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0f8a5f"/><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="6.5" width="13" height="12" rx="1.6"/><path d="M5.5 10h13M9 5v3M15 5v3M8.5 13.5h3M8.5 16h5"/></g></svg>{{ app_name }}</h1>
  <h2 style="margin:0 0 6px">Nové heslo</h2>
  <p class="muted">{{ reset_user.name }} · {{ reset_user.email }}</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="p1">Nové heslo (min. 8 znakov)</label><input type="password" id="p1" name="password" required minlength="8" autofocus autocomplete="new-password"></div>
    <div class="field"><label for="p2">Zopakujte heslo</label><input type="password" id="p2" name="password2" required minlength="8" autocomplete="new-password"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center">Uložiť heslo</button>
  </form>
</div>
{% endblock %}
