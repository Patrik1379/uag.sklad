{% extends 'base.html' %}
{% block title %}Zmena hesla{% endblock %}
{% block content %}
<div class="page-head"><h1>Zmena hesla</h1></div>
<form class="card" method="post" style="max-width:28rem">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Pôvodné heslo</label><input type="password" name="old" required autocomplete="current-password">
  <div style="height:0.667rem"></div><label>Nové heslo</label><input type="password" name="new" required autocomplete="new-password">
  <div class="form-actions"><button class="btn primary">Zmeniť heslo</button></div>
</form>
{% endblock %}
