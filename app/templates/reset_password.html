<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nové heslo · Sklad dielov</title>
  <script>try{var p=parseInt(localStorage.getItem("fontpx"),10),s=localStorage.getItem("fontsize");if(!p&&(s==="l"||s==="xl"))p=17;if(p>=10&&p<=24)document.documentElement.style.fontSize=p+"px";}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=21">
</head>
<body class="login-page">
  <form class="card login-card" method="post">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#2563c9"/><path d="M6 9l6-3 6 3v6l-6 3-6-3zM6 9l6 3 6-3M12 12v6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Sklad dielov
    </div>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    <h2 style="margin:0 0 0.4rem">Nové heslo</h2>
    <p class="small muted" style="margin-top:0">Používateľ <b>{{ user.username }}</b>{% if user.full_name %} ({{ user.full_name }}){% endif %}</p>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="p1">Nové heslo</label>
    <input type="password" id="p1" name="password" autofocus required minlength="4" autocomplete="new-password">
    <div style="height:0.8rem"></div>
    <label for="p2">Zopakujte heslo</label>
    <input type="password" id="p2" name="password2" required minlength="4" autocomplete="new-password">
    <div class="form-actions"><button class="btn primary" style="width:100%;justify-content:center">Uložiť heslo</button></div>
  </form>
</body>
</html>
